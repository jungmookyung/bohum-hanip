<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무과장의 보험 한입</title>
<meta name="description" content="하루 두 번, 보험 용어·제도·청구·약관·유래를 한입 크기로. 공개 자료를 바탕으로 한 학습용 정리입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="무과장의 보험 한입">
<meta property="og:description" content="보험 용어·제도·청구·약관·유래를 한입 크기로 — 지난 한입 모아보기">
<meta property="og:image" content="https://jungmookyung.github.io/bohum-hanip/og.png">
<meta property="og:url" content="https://jungmookyung.github.io/bohum-hanip/">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--navy:#14284b;--navy2:#1f3a68;--ink:#1d2433;--sub:#5b6577;--line:#e3e7ef;--bg:#f4f6fa;--card:#fff;--chip:#eaf0fa;--gold:#c9a24a}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf3;--sub:#a3adbf;--line:#2c3547;--bg:#0f1522;--card:#182033;--chip:#22304d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;line-height:1.6}
header{background:var(--navy);color:#fff;padding:22px 16px 16px}
header .wrap,main,footer{max-width:720px;margin:0 auto}
header h1{margin:0;font-size:22px;letter-spacing:-.3px}
header h1 span{color:var(--gold)}
header p{margin:4px 0 14px;font-size:13px;opacity:.8}
#q{width:100%;padding:11px 13px;border-radius:10px;border:0;font-size:15px;background:#fff;color:#1d2433}
nav{position:sticky;top:0;z-index:2;background:var(--navy2);overflow-x:auto;white-space:nowrap;padding:8px 12px}
nav button{border:0;background:transparent;color:#cfd8ea;font-size:14px;padding:6px 12px;border-radius:16px;cursor:pointer;font-family:inherit}
nav button.on{background:#fff;color:var(--navy);font-weight:700}
main{padding:14px 16px 8px}
.count{font-size:12px;color:var(--sub);margin:2px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--sub)}
.cat{background:var(--chip);color:var(--navy2);font-weight:700;border-radius:10px;padding:1px 9px}
@media (prefers-color-scheme:dark){.cat{color:#c9d6f2}}
.card h2{font-size:17px;margin:8px 0 6px;letter-spacing:-.2px}
.body p{margin:0 0 3px;font-size:15px}
.talk{margin-top:9px;font-size:14px;border-left:3px solid var(--gold);padding-left:9px}
.src{margin-top:9px;font-size:12px;color:var(--sub)}
.src a{color:inherit}
.empty{text-align:center;color:var(--sub);padding:40px 0}
footer{padding:8px 16px 28px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<header><div class="wrap">
<h1>무과장의 <span>보험 한입</span></h1>
<p>하루 두 번, 한입 크기 보험 공부</p>
<input id="q" type="search" placeholder="제목·내용 검색" aria-label="검색">
</div></header>
<nav id="tabs"></nav>
<main><div class="count" id="count"></div><div id="list"></div></main>
<footer>공개 자료를 바탕으로 한 학습용 정리입니다. 최종 확인은 약관·원수사 기준</footer>
<script>
const CATS=["전체","용어","제도","청구","약관","유래"];let items=[],cur="전체";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https:\/\//.test(u)?u:"#";
function tabs(){document.getElementById("tabs").innerHTML=CATS.map(c=>`<button class="${c===cur?"on":""}" data-c="${c}">${c}</button>`).join("");}
function render(){
 const q=document.getElementById("q").value.trim().toLowerCase();
 const L=items.filter(x=>(cur==="전체"||x.cat===cur)&&(!q||[x.title,...(x.body||[]),x.talk].join(" ").toLowerCase().includes(q)));
 document.getElementById("count").textContent=`${L.length}개`;
 document.getElementById("list").innerHTML=L.length?L.map(x=>{
  const m=x.month?`${x.month.slice(0,2)}년 ${+x.month.slice(2)}월 기준`:"";
  const src=(x.src||[]).map(s=>`<a href="${esc(safe(s.url))}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join(" / ");
  return `<article class="card"><div class="meta"><span class="cat">${esc(x.cat)}</span><span>${esc(x.date)}</span></div>
  <h2>${esc(x.title)}</h2><div class="body">${(x.body||[]).map(b=>`<p>${esc(b)}</p>`).join("")}</div>
  ${x.talk?`<div class="talk">상담에선: ${esc(x.talk)}</div>`:""}<div class="src">근거: ${src}${m?" · "+m:""}</div></article>`}).join("")
  :`<div class="empty">${items.length?"찾는 한입이 없어요":"첫 한입을 준비하고 있어요"}</div>`;
}
document.getElementById("tabs").addEventListener("click",e=>{const c=e.target.dataset.c;if(c){cur=c;tabs();render();}});
document.getElementById("q").addEventListener("input",render);
tabs();fetch("items.json?"+Date.now()).then(r=>r.json()).then(d=>{items=d;render();}).catch(()=>render());
</script>
</body>
</html>
